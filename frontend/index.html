<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>CIAL Knowledge OS</title>
    <meta name="description" content="CIAL Knowledge OS - enterprise knowledge dashboard." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="CIAL Knowledge OS" />
    <meta property="og:description" content="CIAL Knowledge OS - enterprise knowledge dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CIAL Knowledge OS" />
    <meta name="twitter:description" content="CIAL Knowledge OS - enterprise knowledge dashboard." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { min-height: 100%; }
      html { background: #f7f9f6; color-scheme: light; }
      html.dark { background: #000; color-scheme: dark; }
      body { margin: 0; background: inherit; }
    </style>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('cial-theme');
          const followsSystem = preference === null || preference === 'system';
          const resolvedDark = preference === 'dark'
            || (followsSystem && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', resolvedDark);
          document.documentElement.style.colorScheme = resolvedDark ? 'dark' : 'light';
        } catch {
          const resolvedDark = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', resolvedDark);
          document.documentElement.style.colorScheme = resolvedDark ? 'dark' : 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
